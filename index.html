<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEFLIK - Watch Anime Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Inter,sans-serif}
.header{background:linear-gradient(90deg,#000,#1a0033);padding:15px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:2px solid #ff0055}
.header h1{font-size:28px;letter-spacing:3px;background:linear-gradient(90deg,#ff0055,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#playerWrap{display:none;background:#000;padding:10px;position:sticky;top:68px;z-index:90}
#playerWrap video{width:100%;max-height:60vh;background:#000}
.player-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.qbtn{padding:8px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;background:#222;color:#fff;border:1px solid #444}
.qbtn.active{background:#ff0055;color:#fff}
.section{padding:20px}
.section h2{margin-bottom:12px;font-size:20px;border-left:4px solid #ff0055;padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:#15151f;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #222;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:#ff0055;box-shadow:0 10px 30px rgba(255,0,85,.3)}
.card img{width:100%;height:190px;object-fit:cover}
.card .info{padding:8px}
.banner{background:linear-gradient(135deg,#1a0033,#330033);border-radius:16px;padding:15px;display:flex;gap:15px;align-items:center;border:1px solid #ffaa0055;margin-bottom:20px}
.banner img{width:120px;height:170px;object-fit:cover;border-radius:10px}
.recommended{border:2px solid #ffaa00;position:relative}
.recommended::before{content:'RECOMMENDED';position:absolute;top:-10px;left:15px;background:#ffaa00;color:#000;font-size:10px;font-weight:900;padding:2px 8px;border-radius:4px}
.complaint-box{background:#15151f;border:1px solid #333;border-radius:12px;padding:15px;margin-top:30px}
.complaint-box textarea{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;min-height:80px}
.complaint-box button{margin-top:10px;background:#ff0055;border:none;padding:10px 20px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="header"><h1>ANIMEFLIK 🔥</h1></div>
<div id="playerWrap">
<video id="mainPlayer" controls></video>
<div class="player-controls">
<button class="qbtn active" onclick="changeQ('1080')">HQ 1080p</button>
<button class="qbtn" onclick="changeQ('720')">HD 720p</button>
<button class="qbtn" onclick="changeQ('480')">LQ 480p</button>
<button class="qbtn" onclick="document.getElementById('mainPlayer').play()" style="background:#ff0055">▶ Play Now</button>
<button class="qbtn" onclick="closePlayer()">✕ Close</button>
</div>
<p id="nowPlaying" style="text-align:center;margin-top:8px;color:#ffaa00;font-size:13px"></p>
</div>
<div class="section">
<div class="banner recommended">
<img src="https://cdn.myanimelist.net/images/anime/1732/138559.jpg">
<div>
<h3>BLUE BOX - Recommended</h3>
<p style="color:#aaa;font-size:13px;margin:8px 0">Sports | Romance | Latest Episode</p>
<button class="qbtn" style="background:#ffaa00;color:#000" onclick="playAnime('Blue Box')">Play Now</button>
</div>
</div>
<h2>BIG THREE LIVE</h2>
<div class="grid" id="bigThree"></div>
</div>
<div class="section">
<h2>Songs - Thumbnail = Title</h2>
<div class="grid" id="songs"></div>
</div>
<div class="section">
<div class="complaint-box">
<h3>🛠️ Shikayat / Auto Healing Board</h3>
<textarea id="complaintInput" placeholder="Apni shikayat likhein..."></textarea>
<button onclick="healSystem()">Auto Fix & Submit</button>
<div id="statusMsg" style="margin-top:10px;color:#0f0"></div>
</div>
</div>
<script>
const animeData=[
{name:"Naruto Shippuden",img:"https://cdn.myanimelist.net/images/anime/5/17407.jpg",cat:"BIG THREE"},
{name:"One Piece",img:"https://cdn.myanimelist.net/images/anime/6/73245.jpg",cat:"BIG THREE"},
{name:"Bleach TYBW",img:"https://cdn.myanimelist.net/images/anime/1764/126627.jpg",cat:"BIG THREE"},
{name:"Jujutsu Kaisen",img:"https://cdn.myanimelist.net/images/anime/1792/138022.jpg",cat:"Trending"},
{name:"Demon Slayer",img:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg",cat:"Trending"},
{name:"No Magic",img:"https://cdn.myanimelist.net/images/anime/1301/142432.jpg",cat:"Magic"},
{name:"Solo Leveling",img:"https://cdn.myanimelist.net/images/anime/1925/142089.jpg",cat:"Trending"}
];
const songData=[
{name:"Arijit Singh - Sajni",img:"https://i.ytimg.com/vi/2Vv-BfVoq4g/hqdefault.jpg"},
{name:"Arijit Singh - Apna Bana Le",img:"https://i.ytimg.com/vi/9Aa1kX3p1Qw/hqdefault.jpg"},
{name:"Pehle Bhi Main",img:"https://i.ytimg.com/vi/Zc8tP3iOa_s/hqdefault.jpg"}
];
const videoSources={"1080":"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4","720":"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4","480":"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4"};
let currentVideo=videoSources["1080"];
function renderAnime(){const grid=document.getElementById('bigThree');animeData.forEach(a=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="${a.img}"><div class="info"><h3>${a.name}</h3><p>${a.cat}</p></div>`;div.onclick=()=>playAnime(a.name);grid.appendChild(div);});}
function renderSongs(){const grid=document.getElementById('songs');songData.forEach(s=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="${s.img}"><div class="info"><h3>${s.name}</h3><p>Thumbnail = Title</p></div>`;div.onclick=()=>playAnime(s.name);grid.appendChild(div);});}
function playAnime(title){document.getElementById('playerWrap').style.display='block';const p=document.getElementById('mainPlayer');p.src=currentVideo;p.play();document.getElementById('nowPlaying').innerText='Now Playing: '+title;window.scrollTo({top:0,behavior:'smooth'});}
function changeQ(q){currentVideo=videoSources[q];document.querySelectorAll('.qbtn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');const p=document.getElementById('mainPlayer');let t=p.currentTime;p.src=currentVideo;p.currentTime=t;p.play();}
function closePlayer(){document.getElementById('playerWrap').style.display='none';document.getElementById('mainPlayer').pause();}
function healSystem(){const input=document.getElementById('complaintInput').value.toLowerCase();const msg=document.getElementById('statusMsg');if(!input){msg.innerText='Kuch likho!';return;}msg.innerText='Checking...';setTimeout(()=>{msg.innerText='✅ Fixed! '+input+' - Auto healing done!';document.getElementById('complaintInput').value='';},1000);}
renderAnime();renderSongs();
</script>
</body>
  </html>
